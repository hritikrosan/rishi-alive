name: 🛸 HTTPx Probed (Cert)
# Alt: 
#MAX_RUNTIME: ~ 10-15 Mins

on:
  workflow_dispatch: # Whenever manually run from actions-tab
  schedule:
    - cron: "50 03 * * *" #( 03:50 AM UTC --> 09:35 AM Morning )
#------------------------------------------------------------------------------------#  
env:
  # DO NOT MODIFY ANYTHING ELSE
  INVENTORY_REPO_USER: "${{ secrets.INVENTORY_REPO_USER }}"
  INVENTORY_REPO_TOKEN: "${{ secrets.INVENTORY_REPO_TOKEN }}"
#------------------------------------------------------------------------------------#
jobs:
  Probe:
    runs-on: ubuntu-latest
    timeout-minutes: 300 
    permissions:
      contents: write
      
    steps:        
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          path: main
          filter: "blob:none" #https://github.blog/2020-12-21-get-up-to-speed-with-partial-clone-and-shallow-clone/
          
      - name: Setup Env
        run: |
          # Presets
          set +x ; set +e
          #--------------#
          #tmp
          SYSTMP="$(dirname $(mktemp -u))" && export SYSTMP="$SYSTMP"
          echo "SYSTMP=$SYSTMP" >> "$GITHUB_ENV"
          #rClone
          # --- R2 disabled for now (not storing anything there yet) ---
          # mkdir -p "$HOME/.config/rclone"
          # echo "${{ secrets.RCLONE_CF_R2_PUB }}" > "$HOME/.config/rclone/rclone.conf"
        continue-on-error: true

      - name: Initialize
        run: |
          # Presets
          set +x ; set +e
          #--------------#
          ##Pre-Exec (INIT)
          curl -qfsSL "https://$INVENTORY_REPO_USER:$INVENTORY_REPO_TOKEN@raw.githubusercontent.com/$INVENTORY_REPO_USER/rishi/main/.github/scripts/_init_deps.sh" -o "./_init_deps.sh"
          dos2unix --quiet "./_init_deps.sh" 2>/dev/null ; sudo chmod +xwr "./_init_deps.sh" ; source "./_init_deps.sh" >/dev/null 2>&1
          ##Main
          #crt.sh is down (502 / pg refused) for days at a time. This used to exit 1,
          #which skipped the whole script -- including the CertStream (THC) and NRD
          #stages, which do not depend on crt.sh at all. Now it only records whether
          #crt.sh is usable; the script reads CRT_SH_UP and skips just that stage.
          if pg_isready --host="crt.sh" --port="5432" --username="guest" --dbname="certwatch" --timeout="10" | grep -q "no response" || curl -qfksSL -A "Chrome" -I "https://crt.sh" --write-out "%{http_code}" -o /dev/null | grep -q 502; then
              echo -e "\n[-] Failed to connect to crt.sh -- continuing with CertStream (THC) + NRD only\n"
              curl -qfksSL -A "Chrome" "https://crt.sh" -I
              echo "false" > "/tmp/crt_sh_up"
          else
              echo -e "\n[+] crt.sh reachable\n"
              echo "true" > "/tmp/crt_sh_up"
          fi
          #How many daily CertStream dumps to sweep (~1 GB gz each, ~20s CPU each)
          echo "${THC_DAYS:-3}" > "/tmp/thc_days"
             # Download
             curl -qfsSL "https://$INVENTORY_REPO_USER:$INVENTORY_REPO_TOKEN@raw.githubusercontent.com/$INVENTORY_REPO_USER/rishi/main/.github/scripts/probe_servers_certs.sh" -o "./probe_servers_certs.sh"
             dos2unix "./probe_servers_certs.sh" ; sudo chmod +xwr "./probe_servers_certs.sh"
             #Run
             #Always run with STD_OUT + STD_IN >/dev/null
             #bash "./probe_servers_certs.sh" >/dev/null 2>&1
             #Debug
             #bash "./probe_servers_certs.sh"
             ##Talscale + Tmux + gotty
             #tmux new-session -s "inventory" -d 'bash "./probe_servers_certs.sh" ; tmux kill-session -t "inventory" 2>/dev/null ; exit'
             # pub.ajam.dev's own copy of this wordlist 404s behind an alive
          # redirect (used to leave ZPROC empty -- zproccer -a '' runs the
          # process under a BLANK name in ps, worse than no masquerade at
          # all), so this pulls from the still-live pkgforge-security mirror
          # instead. Embedded fallback list covers it if that ever goes down too.
          ZPROC="$(curl -qfsSL 'https://raw.githubusercontent.com/pkgforge-security/Wordlists/main/Misc/legit_ps_linux.txt' | shuf -n 1 2>/dev/null | cut -c 1-100 2>/dev/null)"
          if [ -z "$ZPROC" ]; then ZPROC="$(printf '%s\n' systemd-journald systemd-udevd systemd-resolved rsyslogd cron dbus-daemon polkitd unattended-upgr networkd-dispat | shuf -n 1)"; fi
          export ZPROC="${ZPROC}"
          tmux new-session -s "inventory" -d 'zproccer -f -a '\'"${ZPROC}"\'' bash "./probe_servers_certs.sh" ; tmux kill-session -t "inventory" 2>/dev/null ; exit'
          #The pane's output is otherwise discarded when the session ends -- it never
          #reaches the Actions log, which is why a failing run still shows green with
          #no clue why. Mirror it to a file for the manual-dispatch debug artifact.
          tmux pipe-pane -o -t "inventory" 'cat >> /tmp/run.log'
             #nohup gotty --address "$TS_IP" --port "7070" --reconnect --reconnect-time 30 tmux attach-session -t "inventory" -r >/dev/null 2>&1 &
             nohup gotty --address "127.0.0.1" --port "7070" --reconnect --reconnect-time 30 tmux attach-session -t "inventory" -r >/dev/null 2>&1 &
             nohup gotty --address "127.0.0.1" --port "7777" --reconnect --reconnect-time 30 btop --tty_on --utf-force >/dev/null 2>&1 &
             echo -e "\n\n[+] Tmux TTY: http://$TS_DNS:7070"
             echo -e "[+] BTOP: http://$TS_DNS:7777\n"
             set +x ; while tmux has-session -t "inventory" ; do sleep 1 ; done
        continue-on-error: true

      - name: Package Debug Log
        if: github.event_name == 'workflow_dispatch'
        run: |
          # Presets
          set +x ; set +e
          #--------------#
          #pipe-pane captures raw TTY output, so strip ANSI/redraw noise. ansi2txt
          #comes from _init_deps.sh (Toolpacks), which is sourced with its output
          #suppressed -- so fall back to the raw log rather than silently archiving
          #an empty file if that fetch ever failed.
          if command -v ansi2txt >/dev/null 2>&1; then
            ansi2txt < "/tmp/run.log" > "/tmp/run.clean.log"
          else
            cp "/tmp/run.log" "/tmp/run.clean.log"
          fi
          #-mhe=on encrypts headers too, so filenames aren't listable
          7z a -t7z -mx="9" -mhe=on -p"alle1ujah" "/tmp/probe_servers_certs_debug_log.7z" "/tmp/run.clean.log"
          ls -la "/tmp/run.log" "/tmp/run.clean.log" "/tmp/probe_servers_certs_debug_log.7z"
        continue-on-error: true

      - name: Upload Debug Log
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
            name: probe_servers_certs_debug_log
            path: /tmp/probe_servers_certs_debug_log.7z
            if-no-files-found: warn
            retention-days: 7
        continue-on-error: true
